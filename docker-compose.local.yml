services:
  app:
    build:
      context: .
      dockerfile: infra/php/Dockerfile
      target: local-php
      args:
        UID: ${UID}
        GID: ${GID}
    volumes:
      - ./app:/var/www
      - vendor:/var/www/vendor
    env_file:
      - app/.env

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./app:/var/www:ro
    depends_on:
      - app

volumes:
  vendor:


